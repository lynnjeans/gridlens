[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gridlens"
version = "0.1.0"
description = "A local, human-reviewed research assistant for grid connections"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "streamlit>=1.45,<2",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5",
  "pypdf>=5,<7",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pytest-socket>=0.7,<1"]
auth = ["PyJWT[crypto]>=2.10,<3", "openai>=2,<3"]
embeddings = ["sentence-transformers>=6.1,<7"]
vectors = ["chromadb>=1,<2"]
models = ["gridlens[embeddings,vectors]"]

[project.scripts]
gridlens = "gridlens.cli:main"

[tool.setuptools.packages.find]
include = ["gridlens*"]

[tool.setuptools.package-data]
gridlens = ["migrations/*.sql", "prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not live and not local_model" --disable-socket --allow-unix-socket'
markers = [
  "live: requires explicit real service access and human authorization",
  "local_model: requires an explicitly prepared, pinned local model cache",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

